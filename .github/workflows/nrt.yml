name: NRT advisory bundle + Pages deploy
# Runs every 3 hours; ONLY genuine live ingestion may populate live/. Synthetic data is confined to demo/.
# CMEMS credentials live ONLY in repository secrets (Settings > Secrets and variables > Actions):
#   CMEMS_USERNAME, CMEMS_PASSWORD
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["config/**", "data/regulatory/**", "data/manual/**", "backend/**", "assets/**", "*.html", "sw.js", "scripts/build_site.py"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: nrt
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-live.txt
      - run: pip install -r backend/requirements-live.txt
      - name: Fetch previous bundle (carry-forward) from live-data branch
        run: |
          if git ls-remote --exit-code --heads origin live-data >/dev/null 2>&1; then
            git fetch origin live-data --depth=1
            mkdir -p prev_live && git archive FETCH_HEAD | tar -x -C prev_live
          fi
      - uses: actions/cache@v4
        with:
          path: cache
          key: jb-env-${{ github.run_id }}
          restore-keys: jb-env-
      - name: Run pipeline
        id: run
        continue-on-error: true
        env:
          CMEMS_USERNAME: ${{ secrets.CMEMS_USERNAME }}
          CMEMS_PASSWORD: ${{ secrets.CMEMS_PASSWORD }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          PYTHONPATH=backend python -m jelebondhu.cli run --mode live --out dist/live --prev prev_live --cache cache --probe
      - name: "Carry previous bundle forward if QC failed or the run crashed (it ages and is down-graded in the browser)"
        if: steps.run.outcome != 'success'
        run: |
          rm -rf dist/live
          if [ -f prev_live/manifest.json ]; then cp -r prev_live dist/live; echo "carried forward previous bundle"; else echo "no previous bundle - site will show demo/none"; fi
      - name: Validate bundle (hashes, schema, BMD gate)
        run: |
          if [ -f dist/live/manifest.json ]; then PYTHONPATH=backend python -m jelebondhu.cli validate dist/live; fi
      - name: "Publish bundle to live-data branch (orphan, force-pushed so history stays small)"
        if: steps.run.outcome == 'success'
        run: |
          cd dist/live
          git init -q -b live-data && git config user.name "jelebondhu-bot" && git config user.email "bot@users.noreply.github.com"
          git add -A && git commit -q -m "NRT bundle $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" live-data
      - name: Build site
        run: python scripts/build_site.py --live dist/live --out dist/site --demo data/demo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: dist/site}
      - id: deploy
        uses: actions/deploy-pages@v4
