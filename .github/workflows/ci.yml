name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Unit tests (filters, rules, decision logic, bundle integrity)
        run: PYTHONPATH=backend python -m pytest backend/tests -q
      - name: Demo bundle is valid
        run: PYTHONPATH=backend python -m jelebondhu.cli validate data/demo
      - name: JavaScript syntax
        run: for f in assets/js/*.js sw.js; do node --check "$f"; done
      - name: Site builds
        run: python scripts/build_site.py --out dist/site --demo data/demo
